###############################################################################
# Default values for IBM Connectivity pack.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

###############################################################################
# Global Configuration
###############################################################################

skipHooks: false # Set to true to skip pre-install/pre-upgrade hooks (certificate generation job)
# Note: If certificate.generate is true, skipHooks must be false to allow certificate generation
releaseNameOverride: ''
namespace: ''
license:
  accept: false
annotations:
  productID: "0c44732a8b794b2d9e9b842b2dfc8361"
  productName: "IBM Connectivity Pack - Free"
  productMetric: "FREE"
  productChargedContainers: "All"
###############################################################################
# Image Configuration
###############################################################################
image:
  registry: cp.icr.io # Image registry base URL
  path: cp/ibm-eventstreams
  imagePullSecretName: '' # Image pull secret name if already  exist please specify here else give below values for creating new Image pull secret
  imagePullEmail: dummyEmail # Image pull secret email ID
  imagePullUsername: iamapikey # Image pull username 
  imagePullPassword: ibm-entitlement-key # Image pull password 
###############################################################################
# Security Configuration
###############################################################################
certificate:
  enable: true # Enable TLS/MTLS. Set to false for HTTP-only (no encryption)
  MTLSenable: true # Enable MTLS (mutual TLS) requiring client certificates
  # false = TLS only (server cert, no client cert required)
  # true = MTLS (both server and client certificates required)
  generate: true # Set to true to generate new certificates (for certificate rotation)
  # When true, skipHooks must be false to allow the prehook job to run
  clientSecretName: '' # If MTLS/TLS secret for client already exist please specify here
  clientCertPropertyName: 'tls.crt'
  clientCertKeyPropertyName: 'tls.key'
  clientCertPKCSPropertyName: 'pkcs.p12'
  serverSecretName: '' # If MTLS/TLS secret for server already exist please specify here
  serverCertPropertyName: 'tls.crt'
  serverCertKeyPropertyName: 'tls.key'
  caCertPropertyName: 'ca.crt'
  serverKeyStorePKCSPropertyName: 'server.p12'
  serverTrustStorePKCSPropertyName: 'truststore.p12'
  pkcsPassword: '' # pkcs.p12 password
basicAuth:
  enable: false # Enable basic auth for service 
  username: 'csuser'
securityContext:
  capabilities:
    drop:
      - ALL
  privileged: false
  runAsNonRoot: true
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  seccompProfile:
    type: RuntimeDefault
###############################################################################
# Common Application Configuration
###############################################################################
bunyan: "'{\"loglevel\" : \"info\", \"logsrc\" : true, \"logstdouttext\" : {}}'" # Override Log configuration
environmentVariables: {} # Yaml object ENV to be added on action and event pods
enableRefreshTokenMode: true
strictdiscoveryaccount: true
openapiSchemaNoAnonymousTypes: false
enableLegacyApiVersions: false
rateLimitWindowMs: "60000"
rateLimitMaxRequests: "1000"
csCommon:
  eventList: "['salesforceevent','jira','github','googlecalendar','googlebigquery','servicenow','hdfsevent']"
###############################################################################
# Pre-Hook Configuration
###############################################################################
preHook:
  image: connectivity-pack-prehook
  digest: sha256:051d17c033dd57d85637d3aa7a756fddb0be94944deb3ae7ea2789b4eefe90f2
  tag: 3.2.0
###############################################################################
# Action Connectors Configuration
###############################################################################
action:
  name: action-connectors
  image: action-connectors
  digest: sha256:9a871bc10a9879f33bdd38394279f8c25fb3731d955a7e7af1cbd29eedf1dcd9
  fileStreamingTimeout: '120000'
  maxFileSize: '262144000'
  udaPersistentVolumeClaimName: ''
  # Audit Logging Configuration
  auditLogging:
    enable: false # Enable audit logging for action connectors
    # Volume configuration - consumer provides complete volume definition
    # Supports any Kubernetes volume type (PVC, emptyDir, hostPath)
    volume: {}
    # Example - PersistentVolumeClaim:
    # volume:
    #   name: audit-logs
    #   persistentVolumeClaim:
    #     claimName: audit-logs-pvc
    #
    # Example - emptyDir:
    # volume:
    #   name: audit-logs
    #   emptyDir:
    #     sizeLimit: 5Gi
    #
    # Example - hostPath:
    # volume:
    #   name: audit-logs
    #   hostPath:
    #     path: /mnt/audit-logs
    #     type: DirectoryOrCreate
    #

    # File export configuration (always active when auditLogging.enable is true)
    # Audit logs are always mounted at /data/log/audit inside the container
    fileExport:
      logFileName: 'action-audit.log' # Log file name (full path will be mountPath/logFileName)
      maxSize: '5' # Maximum file size in MB before rotation
      backup: '1' # Number of backup files to keep (minimum 1)
  resources: # Update below value for vertical scaling of container
    limits:
      cpu: '1'
      ephemeral-storage: 10Gi
      memory: 750Mi
    requests:
      cpu: 250m
      ephemeral-storage: 5Gi
      memory: 400Mi
  tag: 3.2.0
###############################################################################
# Event Connectors Configuration
###############################################################################
event:
  enable: true # Set to true if Event container is needed
  name: event-connectors
  image: event-connectors # Update image
  digest: sha256:bab0b091e95c92e4b89c9bcdf49d240befe364e631ee9cb6e4af4a23c2258074
  resources: # Update below value for vertical scaling of container
    limits:
      cpu: '1'
      ephemeral-storage: 10Gi
      memory: 750Mi
    requests:
      cpu: 250m
      ephemeral-storage: 5Gi
      memory: 400Mi
  tag: 3.2.0
###############################################################################
# Java Service Configuration
###############################################################################
javaservice:
  enable: false
###############################################################################
# Standard Kubernetes Deployment Configuration
###############################################################################
replicaCount: 1 # Replica of the POD
autoScaling:
  enable: false # Update this to true to enable autoScaling
  minReplicas: 1 # What is the minimum replica needed
  maxReplicas: 5 # What is the maximum replica needed
  cpuUtilization: 70 # % of CPU utilization after which POD to be replicated 
  memoryUtilization: 70 # % of Memory utilization after which POD to be replicated 
###############################################################################
# Knative Deployment Configuration
###############################################################################
knative:
  enable: false # Set to true to deploy as Knative Service instead of standard Deployment
  # Knative autoscaling configuration
  minScale: 0 # Minimum pods (0 = scale-to-zero capability)
  maxScale: 10 # Maximum pods
  scaleDownDelay: "2m" # Time to wait before scaling down
  scaleMetric: "concurrency" # Metric to use for scaling (concurrency, rps, cpu, memory)
  target: 100 # Target value for the scaling metric
  containerConcurrency: 0 # Max concurrent requests per container (0 = unlimited)
###############################################################################
# OpenShift Route Configuration
###############################################################################
route:
  enable: false # generate OpenShift route for external access
  domain: 'example.com' # subdomain of OpenShift cluster where connector service is being deployed
###############################################################################
# MCP Server Configuration
###############################################################################
mcp:
  enable: false # Update this to true to enable mcp server running as HTTP Streamaable  require tools and account config to give 
  accountsSecretName: '<name>' # Give the name of the secret which contains configuration key with accounts.yaml structure.
  toolsSecretName: '<name>' # Give the name of the secret which contains configuration key with tools.json structure.
  oauth:
    enable: false # enables aouth details
    settings: '{ "baseIdpUrl": "<idpUrl>", "wellKnownOAuthMetdataUrl": "<idpUrlwithMetaUri>", "scopesSupported": ["mcp:read", "mcp:tools", "mcp-server-audience"], "oauthAudience": "mcp-server", "clientRegistrationEndpoint": "<>", "mcpMethodRoleMapping": {    "tools/list": ["mcp:read"] ,   "tools/call": ["mcp:tools"]}, "clientDetails": {    "clientId": <>,    "clientSecret": <> } }'
instana:
  enable: false # Set to true to enable Instana monitoring
  disableUseOpentelemetry: true # Disable OpenTelemetry integration
###############################################################################
# ConnPack Connection Manager (connpack-connection-manager)
#
# When enable is false (default):
#   - ibm-connectivity-pack deploys standalone, exactly as before.
#   - Consumers must pass x-ibm-application-credential on every runtime call.
#
# When enable is true:
#   - A separate Deployment + Service for connpack-connection-manager is created
#     inside this same Helm release — same namespace, same image registry,
#     same securityContext, same annotations.
#   - CONNECTION_MANAGER_URL is injected into action/event containers so
#     ibm-connectivity-pack can resolve connectionIds at runtime.
#   - Consumers store connections once and pass only a connectionId in calls.
#
# Environment variables injected into the container (from the app source):
#   K8S_NAMESPACE     — namespace the K8s Secret lives in (auto-set to release namespace)
#   K8S_SECRET_NAME   — name of the K8s Secret that stores accounts (auto-set below)
#   PORT              — HTTP listen port (fixed: 3000)
#   USE_IN_MEMORY_STORE — set to 'true' for local dev / CI (no K8s), 'false' for production
###############################################################################
connectionManager:
  enable: false # Set to true to deploy connpack-connection-manager alongside ibm-connectivity-pack
  name: connpack-connection-manager
  image: connpack-connection-manager # Image name (appended to image.registry/image.path)
  digest: '' # Image digest (sha256:...)
  useInMemoryStore: false # true = in-memory store (dev/CI, no K8s), false = K8s Secret (production)
  resources:
    limits:
      cpu: '500m'
      ephemeral-storage: 5Gi
      memory: 512Mi
    requests:
      cpu: 100m
      ephemeral-storage: 1Gi
      memory: 256Mi
