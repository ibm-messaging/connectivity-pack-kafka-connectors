{{ if and .Values.javaservice.enable .Values.certificate.enable }}
kind: Secret
apiVersion: v1
metadata:
  name: {{ include "ibm-connectivity-pack.keystore-pass-name" . }}
  namespace: {{ include "ibm-connectivity-pack.namespace" . }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
  labels:
    {{- include "ibm-connectivity-pack.labels" . | nindent 4 }}
data:
  keystore.xml: {{ include "ibm-connectivity-pack.keystore-pass" . | b64enc }}
{{ end }}