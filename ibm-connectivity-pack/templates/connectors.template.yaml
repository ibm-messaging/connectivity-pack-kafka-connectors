{{- $root := . }}
{{- $files := $root.Files.Glob "connectors/*.{json,yaml,yml,car}" }}
{{- range $path, $file := $files }}

{{- $filename := base $path }}
{{- $keyname := (regexFindAll "[A-Za-z0-9.]+" $filename -1) | join "" | lower }}
{{- $cleanName := (regexFindAll "[A-Za-z0-9]+" $filename -1) | join "" | lower }}
{{- $cleanRelease := (regexFindAll "[A-Za-z0-9]+" $root.Release.Name -1) | join "" | lower }}

apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-%s-config" $cleanName $cleanRelease }}
  namespace: {{ include "ibm-connectivity-pack.namespace" $root }}
  labels:
    {{- include "ibm-connectivity-pack.labels" $root | nindent 4 }}
  annotations:
    {{- toYaml $root.Values.annotations | nindent 4 }}
binaryData:
  {{ $keyname }}: {{ $file | toString | b64enc }}
---
{{- end }}
