{{/*
###############################################################################
# ICP Connection Manager — Data Secret
#
# Only rendered when connectionManager.enable is true.
#
# UPGRADE-SAFE: The lookup guard checks whether the secret already exists
# before rendering anything. If it exists (i.e. the app has already written
# customer connection data into it), Helm skips this template entirely on
# every subsequent upgrade or rollback — customer data is never overwritten.
#
#   helm install  → secret does not exist → empty shell created
#   helm upgrade  → secret exists         → template skipped, data preserved
#   helm rollback → secret exists         → template skipped, data preserved
###############################################################################
*/}}
{{- if .Values.connectionManager.enable }}
{{- if not (lookup "v1" "Secret" (include "ibm-connectivity-pack.namespace" .) (include "ibm-connectivity-pack.connectionManagerDataSecret" .)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ibm-connectivity-pack.connectionManagerDataSecret" . }}
  namespace: {{ include "ibm-connectivity-pack.namespace" . }}
  labels:
    {{- include "ibm-connectivity-pack.labels" . | nindent 4 }}
    app.kubernetes.io/component: connection-manager
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
type: Opaque
data: {}
{{- end }}
{{- end }}
