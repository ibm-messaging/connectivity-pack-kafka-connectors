{{/*
###############################################################################
# Standard Kubernetes Deployment
#
# This template creates a standard Kubernetes Deployment.
# Only rendered when knative.enable is false.
# For Knative deployments, see knative-service.yaml instead.
###############################################################################
*/}}
{{- if not .Values.knative.enable }}
kind: Deployment
apiVersion: apps/v1
metadata:
  name: {{ include "ibm-connectivity-pack.deploymentName" . }}
  namespace: {{ include "ibm-connectivity-pack.namespace" . }}
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
  labels:
    {{- include "ibm-connectivity-pack.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "ibm-connectivity-pack.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- toYaml .Values.annotations | nindent 8 }}
      labels:
        {{- include "ibm-connectivity-pack.labels" . | nindent 8 }}
    spec:
      restartPolicy: Always
      terminationGracePeriodSeconds: 60
      serviceAccountName: {{ include "ibm-connectivity-pack.serviceAccountName" .}}
      serviceAccount: {{ include "ibm-connectivity-pack.serviceAccountName" .}}
      imagePullSecrets:
        - name: {{ include "ibm-connectivity-pack.imagePullSecretname" . }}
        - name: ibm-entitlement-key
      containers:
        - {{- include "ibm-connectivity-pack.actionContainerYaml" . | nindent 10 }}
        {{ if .Values.event.enable -}}
        - {{- include "ibm-connectivity-pack.eventContainerYaml" . | nindent 10 }}
        {{ end }}
        {{ if .Values.javaservice.enable -}}
        - {{- include "ibm-connectivity-pack.javaContainerYaml" . | nindent 10 }}
        {{ end }}
      volumes:
        {{- include "ibm-connectivity-pack.commonVolumesYaml" . | nindent 8 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
{{- end }}
