{{/*
###############################################################################
# ICP Connection Manager — ClusterIP Service
#
# Only rendered when connectionManager.enable is true.
# Internal-only service — not exposed outside the cluster.
###############################################################################
*/}}
{{- if .Values.connectionManager.enable }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ibm-connectivity-pack.connectionManagerService" . }}
  namespace: {{ include "ibm-connectivity-pack.namespace" . }}
  labels:
    {{- include "ibm-connectivity-pack.labels" . | nindent 4 }}
    app.kubernetes.io/component: connection-manager
  annotations:
    {{- toYaml .Values.annotations | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
  selector:
    {{- include "ibm-connectivity-pack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: connection-manager
{{- end }}
